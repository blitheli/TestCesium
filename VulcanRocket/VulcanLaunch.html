<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.140/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.140/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script type="module">
    import { EPOCH, STOP, TRAJECTORY_VELOCITY } from "./trajectory.js";

    Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI4M2ZhYzM4My1lN2NhLTRjNTktODY1OC1jZDdmOTU3Y2ZjMGEiLCJpZCI6MTMwNTAsInNjb3BlcyI6WyJhc3IiLCJnYyJdLCJpYXQiOjE1NjI0NzA5NzB9.rRTs6chsWJdo9KNYe5VjJj2fUzMHeniIJvFQOd0aLJU";

    const cartesianVelocity = TRAJECTORY_VELOCITY;

    const czml = [
      {
        id: "document",
        name: "Vulcan Launch",
        version: "1.0",
        clock: {
          interval: EPOCH + "/" + STOP,
          currentTime: EPOCH,
          multiplier: 2,
          range: "LOOP_STOP",
          step: "SYSTEM_CLOCK_MULTIPLIER",
        },
      },
      {
        id: "Vulcan",
        name: "Vulcan",
        availability: EPOCH + "/" + STOP,
        position: {
          interpolationAlgorithm: "LAGRANGE",
          referenceFrame: "FIXED",
          interpolationDegree: 5,
          epoch: EPOCH,
          cartesianVelocity: cartesianVelocity,
        },
        path: {
          width: 2,
          leadTime: 0,
          trailTime: 600,
          material: {
            solidColor: {
              color: { rgba: [0, 255, 255, 180] },
            },
          },
        },
        model: {
          gltf: "https://cesium.com/public/SandcastleSampleData/launchvehicle.glb",
          scale: 2.0,
          minimumPixelSize: 128,
          runAnimations: false,
          articulations: {
            "SRBFlames Size": {
              epoch: EPOCH,
              number: [0, 0, 4, 1, 104, 1, 110, 0, 600, 0],
            },
            "BoosterFlames Size": {
              epoch: EPOCH,
              number: [0, 0, 4, 1, 286, 1, 292, 0, 600, 0],
            },
            "SRBs Separate": {
              epoch: EPOCH,
              number: [0, 0, 110, 0, 128, 30, 600, 30],
            },
            "SRBs Drop": {
              epoch: EPOCH,
              number: [0, 0, 112, 0, 132, -25, 600, -25],
            },
            "SRBs Rotate": {
              epoch: EPOCH,
              number: [0, 0, 112, 0, 132, 20, 600, 20],
            },
            "SRBs Size": {
              epoch: EPOCH,
              number: [0, 1, 142, 1, 148, 0, 600, 0],
            },
            "Fairing Open": {
              epoch: EPOCH,
              number: [0, 0, 210, 0, 218, 55, 600, 55],
            },
            "Fairing Separate": {
              epoch: EPOCH,
              number: [0, 0, 212, 0, 226, -15, 600, -15],
            },
            "Fairing Drop": {
              epoch: EPOCH,
              number: [0, 0, 214, 0, 232, -25, 600, -25],
            },
            "Fairing Size": {
              epoch: EPOCH,
              number: [0, 1, 240, 1, 246, 0, 600, 0],
            },
            "Booster MoveZ": {
              epoch: EPOCH,
              number: [0, 0, 296, 0, 314, -40, 600, -40],
            },
            "Booster Size": {
              epoch: EPOCH,
              number: [0, 1, 320, 1, 326, 0, 600, 0],
            },
            "InterstageAdapter MoveZ": {
              epoch: EPOCH,
              number: [0, 0, 296, 0, 314, -24, 600, -24],
            },
            "InterstageAdapter Size": {
              epoch: EPOCH,
              number: [0, 1, 320, 1, 326, 0, 600, 0],
            },
            "UpperStageFlames Size": {
              epoch: EPOCH,
              number: [0, 0, 302, 0, 308, 1, 600, 1],
            },
          },
        },
      },
    ];

    const viewer = new Cesium.Viewer("cesiumContainer", {
      terrain: Cesium.Terrain.fromWorldTerrain(),
      shouldAnimate: true,
    });
    viewer.scene.globe.enableLighting = true;
    // 1. 开启针对高分辨率屏幕的像素比例优化
    viewer.resolutionScale = window.devicePixelRatio; 

    // 2. 告诉 Cesium 使用浏览器推荐的分辨率（关闭此选项可以强制渲染高质量）
    viewer.useBrowserRecommendedResolution = false;

    const dataSource = await Cesium.CzmlDataSource.load(czml);
    await viewer.dataSources.add(dataSource);
    viewer.clockTrackedDataSource = dataSource;
    viewer.timeline.zoomTo(viewer.clock.startTime, viewer.clock.stopTime);

    const rocket = dataSource.entities.getById("Vulcan");
    rocket.orientation = new Cesium.VelocityOrientationProperty(rocket.position);
    // +X 沿速度. 上升段 -X 朝地下, 相机放在侧向才看得到箭体.
    rocket.viewFrom = new Cesium.Cartesian3(40, -220, 60);
    viewer.trackedEntity = rocket;
  </script>
</body>
</html>
