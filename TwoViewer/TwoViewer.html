<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.140/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.140/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #miniViewer {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 300px;
      height: 300px;
    }
    #downloadButton {
      position: absolute;
      top: 10px;
      left: 400px;
      width: 100px;
      height: 30px;
      background-color: #121312;
      color: white;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="miniViewer"></div>
  <div id="downloadButton">下载</div>
  <script type="module">
    
    /*
        下载按钮，点击后，调用captureHighResImage函数，捕获小窗口的图像，并下载。
    */
    const downloadButton = document.getElementById("downloadButton");
    downloadButton.addEventListener("click", () => {
      captureHighResImage(miniViewer, 3000);
    });

    import { captureHighResImage } from "./capture.js";

    /*
        使用两个Viewer 实现画中画功能。
    */
    
    Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI4M2ZhYzM4My1lN2NhLTRjNTktODY1OC1jZDdmOTU3Y2ZjMGEiLCJpZCI6MTMwNTAsInNjb3BlcyI6WyJhc3IiLCJnYyJdLCJpYXQiOjE1NjI0NzA5NzB9.rRTs6chsWJdo9KNYe5VjJj2fUzMHeniIJvFQOd0aLJU";

    // 主Viewer
    const viewer = new Cesium.Viewer("cesiumContainer", {
      //terrain: Cesium.Terrain.fromWorldTerrain(),
      shouldAnimate: true,
    });
    viewer.scene.globe.enableLighting = true;
    // 1. 开启针对高分辨率屏幕的像素比例优化
    viewer.resolutionScale = window.devicePixelRatio; 

    // 2. 告诉 Cesium 使用浏览器推荐的分辨率（关闭此选项可以强制渲染高质量）
    viewer.useBrowserRecommendedResolution = false;

    //=================================================================================
    // 小窗口，同样是Viewer，但是不显示任何UI，只显示地图。
    const miniViewer = new Cesium.Viewer("miniViewer", {
      infoBox: false,
      baseLayer: viewer.baseLayer,
      baseLayerPicker: false,
      timeline: false,
      animation: false,
      geocoder: false,
      homeButton: false,
      fullscreenButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      infoBox: false,
      selectionIndicator: false,
    });
    miniViewer.scene.globe.enableLighting = false;
    miniViewer.scene.requestRenderMode = true;
    miniViewer.scene.fog.enabled = false;
    miniViewer.scene.skyAtmosphere.show = false;
    miniViewer.scene.globe.showGroundAtmosphere = false;

    // 1. 开启针对高分辨率屏幕的像素比例优化
    miniViewer.resolutionScale = window.devicePixelRatio; 
    // 关闭小窗口的旋转、缩放、平移功能
    const cameraController = miniViewer.scene.screenSpaceCameraController;
    cameraController.enableRotate = false;
    cameraController.enableZoom = false;
    cameraController.enablePan = false;

    // 设置相机的位置 缓慢移动
    const startTime = Cesium.JulianDate.clone(viewer.clock.currentTime);
    const originLongitude = 116.397428;
    const originLatitude = 39.90923;
    const cameraHeight = 10000;
    const speedMetersPerSecond = 20;

    function updateMiniCamera() {
      const elapsed = Cesium.JulianDate.secondsDifference(viewer.clock.currentTime, startTime);
      const latOffset = (speedMetersPerSecond * elapsed) / 11132;
      const lonOffset =
        (speedMetersPerSecond * elapsed) /
        (11132 * Math.cos(Cesium.Math.toRadians(originLatitude)));
      miniViewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(
          originLongitude + lonOffset,
          originLatitude + latOffset,
          cameraHeight,
        ),
        orientation: {
          heading: 0,
          pitch: Cesium.Math.toRadians(-90),
          roll: 0,
        },
      });
      miniViewer.scene.requestRender();
    }

    // 获取小窗口的相机视角
   const frustum = miniViewer.camera.frustum;
   if (!(frustum instanceof Cesium.PerspectiveFrustum)) {
    console.log("frustum is not a PerspectiveFrustum");
   }
   const aspect = frustum.aspect;
   frustum.fov = 0.3;
   //console.log(aspect, fov, near, far);

   updateMiniCamera();
   viewer.clock.onTick.addEventListener(updateMiniCamera);

   // 显示帧率
   // 开启帧率显示（默认显示在画布右上角）
  viewer.scene.debugShowFramesPerSecond = true;


  </script>
</body>
</html>
