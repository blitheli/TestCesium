<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Include the CesiumJS JavaScript and CSS files -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.138/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.138/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    }

    #applyBtn {
      padding: 8px 14px;
      border: 1px solid rgba(85, 214, 190, 0.55);
      border-radius: 8px;
      background: rgba(85, 214, 190, 0.18);
      color: #eef6ff;
      font-size: 13px;
      cursor: pointer;
    }

    #applyBtn:hover {
      background: rgba(85, 214, 190, 0.3);
    }

    #codeError {
      display: none;
      margin: 10px 0 0;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(220, 60, 60, 0.2);
      color: #ffb4b4;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #codeError.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="codePanel">
    <h3>代码</h3>
    <textarea id="codeInput" spellcheck="false"></textarea>
    <button id="applyBtn" type="button">应用代码</button>
    <div id="codeError"></div>
  </div>
  <script type="module">

    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI4M2ZhYzM4My1lN2NhLTRjNTktODY1OC1jZDdmOTU3Y2ZjMGEiLCJpZCI6MTMwNTAsInNjb3BlcyI6WyJhc3IiLCJnYyJdLCJpYXQiOjE1NjI0NzA5NzB9.rRTs6chsWJdo9KNYe5VjJj2fUzMHeniIJvFQOd0aLJU';

    // Initialize the Cesium Viewer in the HTML element with the `cesiumContainer` ID.
    const viewer = new Cesium.Viewer('cesiumContainer', {
      terrain: Cesium.Terrain.fromWorldTerrain(),
      shadows: true,
      terrainShadows: Cesium.ShadowMode.ENABLED,
      // false: 按 devicePixelRatio 渲染, 使用浏览器实际分辨率
      useBrowserRecommendedResolution: false,
    });

    viewer.scene.globe.enableLighting = true;

    // 阴影
    const shadowMap = viewer.shadowMap;
    shadowMap.size = 2048;
    shadowMap.softShadows = true;
    shadowMap.darkness = 0.021;
    shadowMap.maximumDistance = 1000.0;

    // 加载 glb 模型, 位置在地球上空 400 km
    const issPosition = Cesium.Cartesian3.fromDegrees(-110, 45, 400000);
    const iss = viewer.entities.add({
      position: issPosition,
      model: {
        //uri: '/model/cesium_air.glb',
        uri: '/model/iss.glb',
        scale: 1.0,
        shadows: Cesium.ShadowMode.ENABLED,
      },
      label: {
        text: '空间站',
        font: '14px sans-serif',
        fillColor: Cesium.Color.WHITE,
        outlineColor: Cesium.Color.BLACK,
        outlineWidth: 2,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        pixelOffset: new Cesium.Cartesian2(0, -28),
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
      },
    });

    // lookAt 绕目标点旋转/缩放, 鼠标操作后仍保持跟随 (trackedEntity 会被取消)
    viewer.camera.lookAt(
      issPosition,
      new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-25), 500)
    );

  </script>
</body>
</html>
