<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Include the CesiumJS JavaScript and CSS files -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.138/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.138/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    }

    #codePanel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      width: min(420px, calc(100vw - 24px));
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      background: rgba(16, 24, 32, 0.88);
      color: #eef6ff;
      font-family: Consolas, "Courier New", monospace;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
    }

    #codePanel h3 {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    #codeInput {
      display: block;
      width: 100%;
      height: 220px;
      margin: 0 0 10px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.35);
      color: #eef6ff;
      font: 13px/1.45 Consolas, "Courier New", monospace;
      resize: vertical;
      box-sizing: border-box;
    }

    #codeInput:focus {
      outline: 1px solid rgba(85, 214, 190, 0.7);
    }

    #applyBtn {
      padding: 8px 14px;
      border: 1px solid rgba(85, 214, 190, 0.55);
      border-radius: 8px;
      background: rgba(85, 214, 190, 0.18);
      color: #eef6ff;
      font-size: 13px;
      cursor: pointer;
    }

    #applyBtn:hover {
      background: rgba(85, 214, 190, 0.3);
    }

    #codeError {
      display: none;
      margin: 10px 0 0;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(220, 60, 60, 0.2);
      color: #ffb4b4;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #codeError.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="codePanel">
    <h3>代码</h3>
    <textarea id="codeInput" spellcheck="false"></textarea>
    <button id="applyBtn" type="button">应用代码</button>
    <div id="codeError"></div>
  </div>
  <script type="module">
    // Your access token can be found at: https://ion.cesium.com/tokens.
    // This is the default access token from your ion account

    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI4M2ZhYzM4My1lN2NhLTRjNTktODY1OC1jZDdmOTU3Y2ZjMGEiLCJpZCI6MTMwNTAsInNjb3BlcyI6WyJhc3IiLCJnYyJdLCJpYXQiOjE1NjI0NzA5NzB9.rRTs6chsWJdo9KNYe5VjJj2fUzMHeniIJvFQOd0aLJU';

    // Initialize the Cesium Viewer in the HTML element with the `cesiumContainer` ID.
    const viewer = new Cesium.Viewer('cesiumContainer', {
      terrain: Cesium.Terrain.fromWorldTerrain(),
    });

    const defaultCode = `const point = viewer.entities.add({
  position: Cesium.Cartesian3.fromDegrees(116.39, 39.9),
  point: {
    pixelSize: 12,
    color: Cesium.Color.RED,
    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
  },
});
viewer.trackedEntity = point;`;

    const codeInput = document.getElementById('codeInput');
    const applyBtn = document.getElementById('applyBtn');
    const codeError = document.getElementById('codeError');

    codeInput.value = defaultCode;

    function applyCode() {
      codeError.classList.remove('visible');
      codeError.textContent = '';
      try {
        // new Function 让引擎在运行时把 textarea 文本编译成函数；再把现成的 viewer 和 Cesium 当参数传进去，所以用户写的代码能立刻操作当前场景。
        const fn = new Function('viewer', 'Cesium', codeInput.value);
        fn(viewer, Cesium);
      } catch (err) {
        codeError.textContent = err && err.message ? err.message : String(err);
        codeError.classList.add('visible');
      }
    }

    applyBtn.addEventListener('click', applyCode);
  </script>
</body>
</html>
