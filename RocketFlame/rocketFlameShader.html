<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cesium Rocket Flame Shader</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.138/Build/Cesium/Cesium.js"></script>
    <link
      href="https://cesium.com/downloads/cesiumjs/releases/1.138/Build/Cesium/Widgets/widgets.css"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      body {
        font-family:
          "Microsoft YaHei",
          "PingFang SC",
          "Noto Sans CJK SC",
          sans-serif;
      }

      .panel {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 10;
        max-width: 420px;
        max-height: calc(100vh - 32px);
        overflow: auto;
        padding: 14px 16px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 12px;
        color: #ffffff;
        background: rgba(15, 22, 32, 0.78);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(8px);
      }

      .panel h1 {
        margin: 0 0 8px;
        font-size: 17px;
      }

      .panel p {
        margin: 0;
        color: rgba(255, 255, 255, 0.78);
        font-size: 13px;
        line-height: 1.6;
      }

      .panel .controls {
        margin-top: 10px;
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 6px 10px;
        align-items: center;
        font-size: 12px;
      }

      .panel .controls label {
        color: rgba(255, 255, 255, 0.85);
      }

      .panel .controls input[type="range"] {
        width: 100%;
      }

      .panel .controls select {
        min-width: 110px;
      }

      .panel .controls .value {
        color: #7fffd4;
        font-family: Consolas, "Courier New", monospace;
        min-width: 54px;
        text-align: right;
      }

      .status {
        margin-top: 10px;
        color: #7fffd4;
        font-family: Consolas, "Courier New", monospace;
        font-size: 12px;
      }

      .status.error {
        color: #ff9a9a;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <aside class="panel" aria-live="polite">
      <h1>Rocket 尾焰着色器</h1>
      <p>
        在火箭尾部挂一组
        <code>cross-plane</code> Primitive,
        通过 <code>rocketFlame.js</code> 复用控制器生成动态发动机尾焰,
        每帧根据 CZML 给出的位置/姿态更新 <code>modelMatrix</code>。
      </p>

      <div class="controls">
        <label for="lengthRange">尾焰长度</label>
        <input id="lengthRange" type="range" min="2" max="80" step="0.5" value="60" />
        <span class="value" id="lengthValue">60.0 m</span>

        <label for="radiusRange">尾焰半径</label>
        <input id="radiusRange" type="range" min="0.2" max="8" step="0.1" value="5" />
        <span class="value" id="radiusValue">5.0 m</span>

        <label for="offsetRange">尾部偏移</label>
        <input id="offsetRange" type="range" min="-10" max="60" step="0.1" value="31" />
        <span class="value" id="offsetValue">31.0 m</span>

        <label for="axisSelect">尾喷方向</label>
        <select id="axisSelect">
          <option value="-Z">-Z (火箭头沿本体 +Z)</option>
          <option value="+Z">+Z (火箭头沿本体 -Z)</option>
          <option value="-X" selected>-X (默认: launchvehicle.glb 尾喷方向)</option>
          <option value="+X">+X (火箭头沿本体 -X)</option>
          <option value="-Y">-Y (火箭头沿本体 +Y)</option>
          <option value="+Y">+Y (火箭头沿本体 -Y)</option>
        </select>
        <span class="value" id="axisValue">-X</span>

        <label for="showRange">显示尾焰</label>
        <input id="showRange" type="range" min="0" max="1" step="1" value="1" />
        <span class="value" id="showValue">ON</span>

        <label for="localXRange">顶部 X 位移</label>
        <input id="localXRange" type="range" min="-50" max="50" step="0.1" value="0" />
        <span class="value" id="localXValue">0.0 m</span>

        <label for="localYRange">顶部 Y 位移</label>
        <input id="localYRange" type="range" min="-50" max="50" step="0.1" value="0" />
        <span class="value" id="localYValue">0.0 m</span>

        <label for="localZRange">顶部 Z 位移</label>
        <input id="localZRange" type="range" min="-50" max="50" step="0.1" value="0" />
        <span class="value" id="localZValue">0.0 m</span>

        <label for="rotateXRange">顶部 X 旋转</label>
        <input id="rotateXRange" type="range" min="-180" max="180" step="1" value="0" />
        <span class="value" id="rotateXValue">0°</span>

        <label for="rotateYRange">顶部 Y 旋转</label>
        <input id="rotateYRange" type="range" min="-180" max="180" step="1" value="0" />
        <span class="value" id="rotateYValue">0°</span>

        <label for="rotateZRange">顶部 Z 旋转</label>
        <input id="rotateZRange" type="range" min="-180" max="180" step="1" value="0" />
        <span class="value" id="rotateZValue">0°</span>

        <label for="intensityRange">强度</label>
        <input id="intensityRange" type="range" min="0.1" max="3" step="0.05" value="1.35" />
        <span class="value" id="intensityValue">1.35</span>

        <label for="turbulenceRange">湍流</label>
        <input id="turbulenceRange" type="range" min="0" max="2.5" step="0.05" value="1.4" />
        <span class="value" id="turbulenceValue">1.40</span>

        <label for="ringCountRange">马赫环数量</label>
        <input id="ringCountRange" type="range" min="0" max="5" step="0.5" value="2" />
        <span class="value" id="ringCountValue">2.0</span>

        <label for="ringContrastRange">马赫环对比</label>
        <input id="ringContrastRange" type="range" min="0" max="1.2" step="0.05" value="0.4" />
        <span class="value" id="ringContrastValue">0.40</span>
      </div>

      <div id="status" class="status">正在加载 rocket.czml...</div>
    </aside>

    <script type="module">
      import { FLAME_STAGES, RocketFlamePrimitive } from "./rocketFlame.js";

      Cesium.Ion.defaultAccessToken =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI4M2ZhYzM4My1lN2NhLTRjNTktODY1OC1jZDdmOTU3Y2ZjMGEiLCJpZCI6MTMwNTAsInNjb3BlcyI6WyJhc3IiLCJnYyJdLCJpYXQiOjE1NjI0NzA5NzB9.rRTs6chsWJdo9KNYe5VjJj2fUzMHeniIJvFQOd0aLJU";

      const status = document.getElementById("status");
      const viewer = new Cesium.Viewer("cesiumContainer", {
        terrain: Cesium.Terrain.fromWorldTerrain(),
        animation: true,
        timeline: true,
        shouldAnimate: true,
      });

      viewer.scene.globe.depthTestAgainstTerrain = true;
      viewer.scene.globe.enableLighting = true;
      viewer.useBrowserRecommendedResolution = false;

      let rocketFlame = null;

      function setStageValue(stageKey, value, output, formatter) {
        if (rocketFlame) {
          rocketFlame.setStage(stageKey, value);
        }
        output.textContent = formatter(value);
      }

      function wireStage(inputId, outputId, stageKey, formatter) {
        const input = document.getElementById(inputId);
        const output = document.getElementById(outputId);
        input.addEventListener("input", () => {
          setStageValue(stageKey, Number(input.value), output, formatter);
        });
      }

      wireStage("lengthRange", "lengthValue", "Flame Length", (v) => v.toFixed(1) + " m");
      wireStage("radiusRange", "radiusValue", "Flame Radius", (v) => v.toFixed(1) + " m");
      wireStage("offsetRange", "offsetValue", "Flame TailOffset", (v) => v.toFixed(1) + " m");
      wireStage("showRange", "showValue", "Flame Show", (v) => (v > 0.5 ? "ON" : "OFF"));
      wireStage("localXRange", "localXValue", "Flame LocalX", (v) => v.toFixed(1) + " m");
      wireStage("localYRange", "localYValue", "Flame LocalY", (v) => v.toFixed(1) + " m");
      wireStage("localZRange", "localZValue", "Flame LocalZ", (v) => v.toFixed(1) + " m");
      wireStage("rotateXRange", "rotateXValue", "Flame RotateX", (v) => v.toFixed(0) + "°");
      wireStage("rotateYRange", "rotateYValue", "Flame RotateY", (v) => v.toFixed(0) + "°");
      wireStage("rotateZRange", "rotateZValue", "Flame RotateZ", (v) => v.toFixed(0) + "°");
      wireStage("intensityRange", "intensityValue", "Flame Intensity", (v) => v.toFixed(2));
      wireStage("turbulenceRange", "turbulenceValue", "Flame Turbulence", (v) => v.toFixed(2));
      wireStage("ringCountRange", "ringCountValue", "Flame RingCount", (v) => v.toFixed(1));
      wireStage("ringContrastRange", "ringContrastValue", "Flame RingContrast", (v) => v.toFixed(2));

      const axisSelect = document.getElementById("axisSelect");
      const axisValue = document.getElementById("axisValue");
      axisSelect.addEventListener("change", () => {
        if (rocketFlame) {
          rocketFlame.setAxis(axisSelect.value);
        }
        axisValue.textContent = axisSelect.value;
      });

      try {
        const dataSource = await Cesium.CzmlDataSource.load("./rocket.czml");
        await viewer.dataSources.add(dataSource);

        viewer.clockTrackedDataSource = dataSource;

        if (dataSource.clock) {
          viewer.timeline.zoomTo(dataSource.clock.startTime, dataSource.clock.stopTime);
        }

        //  获取rocket
        const rocket = dataSource.entities.getById("LaunchVehicle/LaunchVehicle1");

        //  创建火焰primitive
        rocketFlame = new RocketFlamePrimitive({ viewer, parentEntity: rocket });

        //  增加事件
        viewer.scene.preUpdate.addEventListener((scene, time) => {
          rocketFlame.update(time);
        });

        if (rocket) {
          await viewer.zoomTo(rocket);
          viewer.trackedEntity = rocket;
        } else {
          await viewer.zoomTo(dataSource);
        }
        status.textContent = "rocket.czml 加载完成, 尾焰控制器已挂载";

        window.rocketFlame = {
          viewer,
          controller: rocketFlame,
          stages: FLAME_STAGES,
          getPrimitive: () => rocketFlame.primitive,
        };
      } catch (error) {
        console.error("Failed to load rocket.czml", error);
        status.textContent = "rocket.czml 加载失败, 请确认通过静态服务器访问项目根目录。";
        status.classList.add("error");
      }
    </script>
  </body>
</html>
