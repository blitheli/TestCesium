<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cesium Rocket Flame Shader (flamePlane + _DDD, fbm 尾焰)</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.138/Build/Cesium/Cesium.js"></script>
    <link
      href="https://cesium.com/downloads/cesiumjs/releases/1.138/Build/Cesium/Widgets/widgets.css"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      body {
        font-family:
          "Microsoft YaHei",
          "PingFang SC",
          "Noto Sans CJK SC",
          sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>

    <script type="module">
      Cesium.Ion.defaultAccessToken =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI4M2ZhYzM4My1lN2NhLTRjNTktODY1OC1jZDdmOTU3Y2ZjMGEiLCJpZCI6MTMwNTAsInNjb3BlcyI6WyJhc3IiLCJnYyJdLCJpYXQiOjE1NjI0NzA5NzB9.rRTs6chsWJdo9KNYe5VjJj2fUzMHeniIJvFQOd0aLJU";

      const viewer = new Cesium.Viewer("cesiumContainer", {
        terrain: Cesium.Terrain.fromWorldTerrain(),
        animation: true,
        timeline: true,
        shouldAnimate: false,
        orderIndependentTranslucency: false,
      });

      viewer.scene.globe.depthTestAgainstTerrain = true;
      viewer.scene.globe.enableLighting = true;
      viewer.scene.highDynamicRange = true;
      viewer.useBrowserRecommendedResolution = false;

      window.rocketFlameMesh4 = {
        viewer,
        flameCustomShader: null,
        rocket: null,
        attachCustomShaderToEntityModel: null,
        FLAME_PLANE_BB_MIN: null,
        FLAME_PLANE_BB_MAX: null,
        status: "booting",
      };

      const FLAME_PLANE_BB_MIN = new Cesium.Cartesian3(-1.0, -1.0, -20.0);
      const FLAME_PLANE_BB_MAX = new Cesium.Cartesian3(1.0, 1.0, -20.0);
      const INITIAL_LOAD_PAUSE_MS = 2000;
      const USE_SOLID_COLOR_TEST = false;
      const SOLID_COLOR_TEST_TARGET = "flame-plane";

      function sleep(ms) {
        return new Promise((resolve) => {
          window.setTimeout(resolve, ms);
        });
      }

      function colorToVec4(c) {
        return new Cesium.Cartesian4(c.red, c.green, c.blue, c.alpha);
      }

      const flameUniforms = {
        u_time: { type: Cesium.UniformType.FLOAT, value: 0.0 },
        u_coreColor: {
          type: Cesium.UniformType.VEC4,
          value: colorToVec4(Cesium.Color.fromCssColorString("#fff5e6")),
        },
        u_flameColor: {
          type: Cesium.UniformType.VEC4,
          value: colorToVec4(Cesium.Color.fromCssColorString("#ff6b1a")),
        },
        u_smokeColor: {
          type: Cesium.UniformType.VEC4,
          value: colorToVec4(Cesium.Color.fromCssColorString("#9c4028")),
        },
        u_farSmokeColor: {
          type: Cesium.UniformType.VEC4,
          value: colorToVec4(Cesium.Color.fromCssColorString("#5a5048")),
        },
        u_intensity: { type: Cesium.UniformType.FLOAT, value: 1.5 },
        u_turbulenceAmount: { type: Cesium.UniformType.FLOAT, value: 1.25 },
        u_ringCount: { type: Cesium.UniformType.FLOAT, value: 1.5 },
        u_ringContrast: { type: Cesium.UniformType.FLOAT, value: 0.28 },
      };

      // 使用 _DDD(->ddd) 区分 flamePlane，仅在 flamePlane 上执行尾焰 shader。
      const flameCustomShader = new Cesium.CustomShader({
        mode: Cesium.CustomShaderMode.MODIFY_MATERIAL,
        translucencyMode: Cesium.CustomShaderTranslucencyMode.INHERIT,
        uniforms: flameUniforms,
        varyings: {
          v_flameUv: Cesium.VaryingType.VEC2,
          v_flameTag: Cesium.VaryingType.FLOAT,
        },
        vertexShaderText: `
          void vertexMain(VertexInput vsInput, inout czm_modelVertexOutput vsOutput) {
            v_flameUv = vsInput.attributes.texCoord_0;
            v_flameTag = vsInput.attributes.ddd;

            if (v_flameTag > 0.5) {
              vec2 centeredUv = vsInput.attributes.texCoord_0 - vec2(0.5);
              vsOutput.positionMC.xy += centeredUv * 0.30;
            }
          }
        `,
        fragmentShaderText: `
          float rf_hash(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
          }

          float rf_noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(
              mix(rf_hash(i + vec2(0.0, 0.0)), rf_hash(i + vec2(1.0, 0.0)), u.x),
              mix(rf_hash(i + vec2(0.0, 1.0)), rf_hash(i + vec2(1.0, 1.0)), u.x),
              u.y
            );
          }

          float rf_fbm(vec2 p) {
            float value = 0.0;
            float amplitude = 0.5;
            for (int i = 0; i < 5; i++) {
              value += amplitude * rf_noise(p);
              p *= 2.05;
              amplitude *= 0.5;
            }
            return value;
          }

          float rf_fade(float edge0, float edge1, float x) {
            return 1.0 - smoothstep(edge0, edge1, x);
          }

          void fragmentMain(FragmentInput fsInput, inout czm_modelMaterial material) {
            bool isFlamePlane = v_flameTag > 0.5;

            ${USE_SOLID_COLOR_TEST && SOLID_COLOR_TEST_TARGET === "whole-model" ? `
              vec3 debugColor = vec3(0.05, 0.95, 0.2);
              material.diffuse = vec3(0.0);
              material.emissive = debugColor * 2.5;
              material.alpha = 1.0;
              material.specular = vec3(0.0);
              material.roughness = 1.0;
              return;
            ` : ``}

            if (!isFlamePlane) {
              return;
            }

            ${USE_SOLID_COLOR_TEST && SOLID_COLOR_TEST_TARGET === "flame-plane" ? `
              vec3 debugColor = vec3(1.0, 0.25, 0.05);
              material.diffuse = vec3(0.0);
              material.emissive = debugColor * 4.0;
              material.alpha = 1.0;
              material.specular = vec3(0.0);
              material.roughness = 1.0;
              return;
            ` : ``}

            vec2 uv = v_flameUv;
            float along = clamp(uv.y, 0.0, 1.0);
            float lateral = uv.x - 0.5;

            float spread = mix(0.62 + u_turbulenceAmount * 0.055, 0.052, pow(along, 0.72));
            spread = max(spread, 0.048);

            float turb = rf_fbm(vec2(lateral * 6.5, along * 3.8 - u_time * 5.0));
            float turb2 = rf_fbm(vec2(lateral * 3.2 + 19.0, along * 2.0 - u_time * 2.4));
            float turb3 = rf_fbm(vec2(lateral * 10.0 - 4.0, along * 6.5 - u_time * 3.8));

            float streak = rf_fbm(vec2(lateral * 4.0 + turb * 0.4, along * 48.0 - u_time * 22.0));
            float streakWarp = (streak - 0.5) * 0.14 * u_turbulenceAmount;

            float wobble = (turb - 0.5) * 0.32 * u_turbulenceAmount * smoothstep(0.0, 0.45, along);
            float dist = abs(lateral / spread + wobble + streakWarp) * 2.0;

            float ringZone = clamp((along - 0.08) / 0.40, 0.0, 1.0);
            float ringPhase = ringZone * u_ringCount * 6.2831853 + sin(lateral * 11.0 + 7.3) * 0.45;
            float rings = smoothstep(0.72, 0.96, sin(ringPhase));
            float ringMask = rf_fade(0.42, 0.55, along) * smoothstep(0.08, 0.16, along);
            ringMask *= smoothstep(0.0, 0.5, u_ringCount);

            float core = rf_fade(0.0, 0.50, dist) * rf_fade(0.0, 0.38, along);
            float flame = rf_fade(0.06, 1.05, dist)
              * rf_fade(0.02, 0.72, along)
              * (1.0 + turb2 * 0.22 * u_turbulenceAmount);
            float plumeDist = dist - turb3 * 0.38 * u_turbulenceAmount * smoothstep(0.15, 0.78, along);
            float plume = rf_fade(0.06, 1.05, plumeDist)
              * smoothstep(0.28, 0.52, along)
              * rf_fade(0.68, 1.0, along)
              * (0.52 + turb * 0.55 * u_turbulenceAmount);

            float farFade = 1.0 - smoothstep(0.58, 0.995, along);
            float tailThin = mix(1.0, 0.32, smoothstep(0.35, 0.88, along));

            vec3 smokeAt = mix(u_smokeColor.rgb, u_farSmokeColor.rgb, smoothstep(0.22, 0.82, along));
            vec3 col = smokeAt;
            col = mix(col, u_flameColor.rgb, clamp(flame, 0.0, 1.0));
            vec3 hotWhite = vec3(1.0, 0.97, 0.92);
            col = mix(col, mix(u_coreColor.rgb, hotWhite, 0.65), clamp(core, 0.0, 1.0));

            float ringRadialMask = rf_fade(0.18, 0.62, dist);
            float ringBoost = rings * ringMask * ringRadialMask * u_ringContrast;
            col = mix(col, u_coreColor.rgb, ringBoost * 0.38);

            float alpha = 0.0;
            alpha = max(alpha, core * 1.55);
            alpha = max(alpha, flame * 1.12);
            alpha = max(alpha, plume * 0.20);
            alpha *= 1.0 + ringBoost * 0.28;
            alpha *= farFade * tailThin * u_intensity;
            alpha = clamp(alpha, 0.0, 1.0);

            if (alpha < 0.01) {
              discard;
            }

            float emBase = 0.85 + 2.9 * alpha + ringBoost * 0.85;
            vec3 em = col * emBase;

            material.baseColor = vec4(0.0, 0.0, 0.0, 1.0);
            material.diffuse = vec3(0.0);
            material.emissive = em;
            material.alpha = alpha;
            material.specular = vec3(0.0);
            material.roughness = 1.0;
          }
        `,
      });

      viewer.scene.postUpdate.addEventListener((scene, time) => {
        flameCustomShader.setUniform(
          "u_time",
          Cesium.JulianDate.secondsDifference(time, viewer.clock.startTime),
        );
      });

      function visitPrimitives(collection, visit) {
        if (!collection || typeof collection.length !== "number") {
          return false;
        }

        for (let i = 0; i < collection.length; i++) {
          const primitive = collection.get(i);
          if (primitive instanceof Cesium.PrimitiveCollection) {
            if (visitPrimitives(primitive, visit)) {
              return true;
            }
            continue;
          }

          if (visit(primitive)) {
            return true;
          }
        }

        return false;
      }

      function attachCustomShaderToEntityModel(entity, shader) {
        const wantId = entity.id;
        return visitPrimitives(viewer.scene.primitives, (p) => {
          const sameEntity =
            p instanceof Cesium.Model &&
            p.id &&
            (p.id === entity || p.id.id === wantId);
          if (sameEntity) {
            if (!p.ready) {
              return false;
            }

            p.backFaceCulling = false;

            if (p.customShader !== shader) {
              p.customShader = shader;
            }
            return p.customShader === shader;
          }
          return false;
        });
      }

      try {
        window.rocketFlameMesh4.status = "loading-czml";
        const dataSource = await Cesium.CzmlDataSource.load("./simpleRocket.czml");
        await viewer.dataSources.add(dataSource);

        viewer.clockTrackedDataSource = dataSource;

        if (dataSource.clock) {
          viewer.timeline.zoomTo(dataSource.clock.startTime, dataSource.clock.stopTime);
        }

        const rocket = dataSource.entities.getById("LaunchVehicle/LaunchVehicle1");

        window.rocketFlameMesh4.flameCustomShader = flameCustomShader;
        window.rocketFlameMesh4.rocket = rocket;
        window.rocketFlameMesh4.attachCustomShaderToEntityModel = attachCustomShaderToEntityModel;
        window.rocketFlameMesh4.FLAME_PLANE_BB_MIN = FLAME_PLANE_BB_MIN;
        window.rocketFlameMesh4.FLAME_PLANE_BB_MAX = FLAME_PLANE_BB_MAX;
        window.rocketFlameMesh4.status = "loaded-czml";

        if (rocket && rocket.model) {
          rocket.model.incrementallyLoadTextures = new Cesium.ConstantProperty(false);
          rocket.model.customShader = new Cesium.ConstantProperty(flameCustomShader);

          // Cesium 1.138 在这份资产上经由 ModelGraphics.customShader 会生成缺失
          // customShaderStage 定义的坏管线，因此仅对底层 Model primitive 挂 shader。
          // 跟踪视角切换时底层 primitive 可能会重建，测试页持续补挂，确保 shader 不丢。
          function tryAttachPrimitiveShader() {
            attachCustomShaderToEntityModel(rocket, flameCustomShader);
          }
          viewer.scene.postUpdate.addEventListener(tryAttachPrimitiveShader);
          tryAttachPrimitiveShader();
        }

        if (rocket) {
          viewer.flyTo(rocket, {
            offset: new Cesium.HeadingPitchRange(
              Cesium.Math.toRadians(180.0),
              Cesium.Math.toRadians(-8.0),
              48.0,
            ),
          });
          viewer.trackedEntity = rocket;
          window.rocketFlameMesh4.status = "tracking-rocket";
        } else {
          await viewer.zoomTo(dataSource);
          window.rocketFlameMesh4.status = "zoomed-datasource";
        }

        await sleep(INITIAL_LOAD_PAUSE_MS);
        viewer.clock.shouldAnimate = true;
        window.rocketFlameMesh4.status = "running";
      } catch (error) {
        window.rocketFlameMesh4.status = "load-failed";
        console.error("Failed to load simpleRocket.czml", error);
      }
    </script>
  </body>
</html>
